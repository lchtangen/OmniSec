# NetHunter NextGen Pre-Commit Hooks
# PRIORITY: P1
# Install: pre-commit install

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-keys
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]
        files: \.(sh|bash|zsh)$
        types: [shell]

  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: \.py$
        types: [file]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(md|json|yaml|yml)$
        args: [--prose-wrap=preserve]

  - repo: local
    hooks:
      - id: nh-validate
        name: NetHunter validation
        entry: bash -c 'make lint 2>&1 | tail -5'
        language: system
        pass_filenames: false
        always_run: true

      - id: nh-priority
        name: Check priority declarations
        entry: bash -c '
          for f in $(git diff --cached --name-only); do
            grep -q "PRIORITY:" "$f" 2>/dev/null || echo "MISSING PRIORITY: $f"
          done'
        language: system
        pass_filenames: false
        always_run: true

      - id: nh-no-secrets
        name: Check for secrets in code
        entry: bash -c '
          ! git diff --cached -U0 | grep -iE "(password|secret|api[_-]?key|token|credential)" | grep -v "^[+-]|#|//|;.*"
        '
        language: system
        pass_filenames: false
        always_run: true
