# NH_KERNEL_FRAGMENT: wireless-extended v3.0
# OmniSec Extended Wireless — Full USB WiFi driver coverage
# Covers every major pentesting adapter: Alfa, Panda, TP-Link, etc.
# Apply on top of nethunter.conf for omnisec/offensive variants

# ── cfg80211 / mac80211 — regulatory bypass + injection support ────
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_CFG80211_INTERNAL_REGDB=y
# Allows use of restricted channels and TX power (bypass regulatory)
CONFIG_CFG80211_CERTIFICATION_ONUS=y
CONFIG_WIRELESS_EXT=y
CONFIG_WEXT_CORE=y
CONFIG_WEXT_PROC=y
CONFIG_WEXT_SPY=y
CONFIG_WEXT_PRIV=y
CONFIG_MAC80211=y
# Monitor mode + frame injection tracing
CONFIG_MAC80211_MESSAGE_TRACING=y
CONFIG_MAC80211_HT_DEBUG=y
CONFIG_MAC80211_VHT_DEBUG=y
CONFIG_MAC80211_DEBUGFS=y
CONFIG_MAC80211_RC_MINSTREL=y
CONFIG_MAC80211_RC_MINSTREL_HT=y
CONFIG_MAC80211_RC_MINSTREL_VHT=y
CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y
CONFIG_MAC80211_LEDS=y
CONFIG_MAC80211_IBSS_DEBUG=y
# Mesh networking (802.11s) — for mesh AP attacks
CONFIG_MAC80211_MESH=y

# ── Realtek — USB (most common pentesting chipsets) ───────────────
# RTL8187/8187B — Alfa AWUS036H (classic injection adapter)
CONFIG_RTL8187=m
CONFIG_RTL8187_LEDS=y
# RTL8192CU — older AC adapters
CONFIG_RTL8192CU=m
# RTL8XXXU — unified Realtek USB: 8188EU, 8192EU, 8811AU, 8821AU
CONFIG_RTL8XXXU=m
CONFIG_RTL8XXXU_UNTESTED=y
# RTLWifi family — PCI + USB combo (8192CE, 8192SE, 8821AE, etc.)
CONFIG_RTLWIFI=m
CONFIG_RTLWIFI_USB=m
CONFIG_RTLWIFI_DEBUG=y
CONFIG_RTL8192CE=m
CONFIG_RTL8192SE=m
CONFIG_RTL8192DE=m
CONFIG_RTL8723BE=m
CONFIG_RTL8188EE=m
CONFIG_RTL8192EE=m
CONFIG_RTL8821AE=m
CONFIG_RTL8723DE=m
CONFIG_RTLBTCOEXIST=y
# RTL8821CE — AC1200 PCIe (built-in cards)
CONFIG_RTL8821CE=m

# ── Ralink / MediaTek — USB ───────────────────────────────────────
# RT2x00 — widest compatibility (Alfa AWUS051NH, etc.)
CONFIG_RT2X00=m
CONFIG_RT2500USB=m
CONFIG_RT73USB=m
CONFIG_RT2800USB=m
CONFIG_RT2800USB_RT33XX=y
CONFIG_RT2800USB_RT35XX=y
CONFIG_RT2800USB_RT3573=y
CONFIG_RT2800USB_RT53XX=y
CONFIG_RT2800USB_RT55XX=y
CONFIG_RT2800USB_UNKNOWN=y
# MT76 — modern MediaTek: MT7612U (Alfa AWUS036ACM), MT7921U
CONFIG_MT76_USB=m
CONFIG_MT76x0_USB=m
CONFIG_MT76x2_USB=m
CONFIG_MT7615_USB=m
CONFIG_MT7921_USB=m
CONFIG_MT76_CONNAC_LIB=m

# ── Atheros — USB (best open-source injection support) ────────────
# AR9271 — Alfa AWUS036NHA (king of injection, fully open-source)
CONFIG_ATH9K_HTC=m
CONFIG_ATH9K_HTC_DEBUGFS=y
CONFIG_ATH_DEBUG=y
CONFIG_ATH_TRACEPOINTS=y
# Carl9170 — AR9170 (older but good injection)
CONFIG_CARL9170=m
CONFIG_CARL9170_LEDS=y
CONFIG_CARL9170_WPC=y
# AR5523 — very old, still useful
CONFIG_AR5523=m
# ATH9K PCI — onboard Atheros
CONFIG_ATH9K=m
CONFIG_ATH9K_DEBUGFS=y
CONFIG_ATH9K_STATION_STATISTICS=y
CONFIG_ATH9K_TX99=y
# ATH10K — 802.11ac Atheros
CONFIG_ATH10K=m
CONFIG_ATH10K_USB=m
CONFIG_ATH10K_DEBUG=y
CONFIG_ATH10K_DEBUGFS=y
CONFIG_ATH10K_TRACING=y

# ── ZyDAS ─────────────────────────────────────────────────────────
CONFIG_ZD1211RW=m
CONFIG_ZD1211RW_DEBUG=y

# ── Intel ─────────────────────────────────────────────────────────
CONFIG_IWLWIFI=m
CONFIG_IWLMVM=m
CONFIG_IWLDVM=m
CONFIG_IWLWIFI_DEBUG=y
CONFIG_IWLWIFI_DEBUGFS=y

# ── Marvell ───────────────────────────────────────────────────────
CONFIG_MWIFIEX=m
CONFIG_MWIFIEX_USB=m
CONFIG_MWIFIEX_SDIO=m

# ── Broadcom ──────────────────────────────────────────────────────
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_USB=y
CONFIG_BRCMFMAC_SDIO=y

# ── 6GHz / WiFi 6E support ────────────────────────────────────────
CONFIG_CFG80211_EXTRA_REGDB_KEYDIR="/lib/firmware/regulatory.db"

# ── Bluetooth LE — BLE sniffing and attacks ────────────────────────
CONFIG_BT_LE=y
CONFIG_BT_LE_L2CAP_ECRED=y
CONFIG_BT_SELFTEST=y
CONFIG_BT_SELFTEST_ECDH=y
CONFIG_BT_SELFTEST_SMP=y
CONFIG_BT_DEBUGFS=y
CONFIG_BT_LEDS=y
# More BT adapters
CONFIG_BT_ATH3K=m
CONFIG_BT_MTKUART=m
CONFIG_BT_VIRTIO=y
CONFIG_BT_CMTP=y

# ── IEEE 802.15.4 — ZigBee/IoT protocol attacks ───────────────────
CONFIG_IEEE802154=m
CONFIG_IEEE802154_NET=m
CONFIG_IEEE802154_6LOWPAN=m
CONFIG_MAC802154=m
CONFIG_IEEE802154_AT86RF230=m
CONFIG_IEEE802154_MRF24J40=m
CONFIG_IEEE802154_CC2520=m
CONFIG_IEEE802154_HWSIM=m
