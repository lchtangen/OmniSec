# NH_KERNEL_FRAGMENT: hardware-hacking v3.0
# OmniSec Hardware Attack Surface Config
# GPIO, SPI, I2C, CAN bus, SDR, 1-Wire, JTAG/UART, USB fuzzing
# Apply on top of offensive.conf for hardware-targeting variants

# ── GPIO — userspace control of hardware pins ─────────────────────
CONFIG_GPIOLIB=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_CDEV=y
CONFIG_GPIO_CDEV_V1=y
CONFIG_GPIO_BITBANG=y
CONFIG_GPIO_GENERIC=y
CONFIG_GPIO_MOCKUP=m

# ── I2C — bus sniffing, EEPROM/sensor access ──────────────────────
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_COMPAT=y
CONFIG_I2C_MUX=y
CONFIG_I2C_HELPER_AUTO=y
CONFIG_I2C_GPIO=y
CONFIG_I2C_STUB=m

# ── SPI — flash, display, sensor attacks ─────────────────────────
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_SPIDEV=y
CONFIG_SPI_BITBANG=y
CONFIG_SPI_GPIO=y
CONFIG_SPI_LOOPBACK_TEST=m

# ── 1-Wire — iButton, DS18B20 attacks ────────────────────────────
CONFIG_W1=y
CONFIG_W1_CON=y
CONFIG_W1_MASTER_DS2490=m
CONFIG_W1_MASTER_DS2482=m
CONFIG_W1_SLAVE_DS2405=m
CONFIG_W1_SLAVE_DS2408=m
CONFIG_W1_SLAVE_DS2413=m
CONFIG_W1_SLAVE_DS2423=m
CONFIG_W1_SLAVE_DS2431=m
CONFIG_W1_SLAVE_DS2433=m
CONFIG_W1_SLAVE_DS2438=m
CONFIG_W1_SLAVE_DS2406=m
CONFIG_W1_SLAVE_DS2780=m
CONFIG_W1_SLAVE_DS2781=m

# ── CAN bus — OBD-II / automotive / industrial hacking ────────────
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_GW=y
CONFIG_CAN_ISOTP=y
CONFIG_CAN_J1939=y
CONFIG_CAN_VCAN=y
CONFIG_CAN_VXCAN=y
CONFIG_CAN_SLCAN=y
CONFIG_CAN_KVASER_USB=m
CONFIG_CAN_PEAK_USB=m
CONFIG_CAN_EMS_USB=m
CONFIG_CAN_8DEV_USB=m
CONFIG_CAN_MCBA_USB=m
CONFIG_CAN_GS_USB=m

# ── IIO / ADC — SDR radio interface ───────────────────────────────
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_BUFFER_CB=y
CONFIG_IIO_KFIFO_BUF=y
CONFIG_IIO_CONFIGFS=y
CONFIG_IIO_TRIGGER=y

# ── DVB / RTL-SDR — software defined radio (RTL2832U) ─────────────
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_DVB_USB=m
CONFIG_DVB_USB_RTL28XXU=m
CONFIG_DVB_RTL2830=m
CONFIG_DVB_RTL2832=m
CONFIG_DVB_RTL2832_SDR=m

# ── HID / UHID — custom HID device injection ─────────────────────
CONFIG_HID=y
CONFIG_HID_GENERIC=y
CONFIG_UHID=y
CONFIG_USB_HID=y
CONFIG_USB_HIDDEV=y
CONFIG_HID_BATTERY_STRENGTH=y

# ── USB gadget extended — full attack surface ─────────────────────
CONFIG_USB_RAW_GADGET=y
CONFIG_USB_GADGET_DEBUG_FS=y
CONFIG_USB_GADGET_DEBUG_FILES=y
CONFIG_USB_GADGET_VBUS_DRAW=900
CONFIG_USB_CONFIGFS_F_UVC=y
CONFIG_USB_CONFIGFS_F_MIDI=y
CONFIG_USB_CONFIGFS_F_ACC=y
CONFIG_USB_CONFIGFS_F_AUDIO_SRC=y
CONFIG_USB_CONFIGFS_F_TCM=y
CONFIG_USB_G_PRINTER=y
CONFIG_USB_G_SERIAL=y
CONFIG_USB_CDC_COMPOSITE=y
CONFIG_USB_G_NCM=y
CONFIG_USB_G_MULTI=y
CONFIG_USB_GADGETFS=y
CONFIG_USB_FUNCTIONFS=y
CONFIG_USB_MASS_STORAGE=y
CONFIG_USB_ZERO=y
CONFIG_USB_ETH=y

# ── RFKILL — control all RF interfaces ────────────────────────────
CONFIG_RFKILL=y
CONFIG_RFKILL_LEDS=y
CONFIG_RFKILL_INPUT=y
CONFIG_RFKILL_GPIO=y

# ── UART / serial — JTAG/SWD/console access ──────────────────────
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y
CONFIG_SERIAL_EARLYCON=y
CONFIG_TTY=y
CONFIG_UNIX98_PTYS=y

# ── Platform leds — indicator control ────────────────────────────
CONFIG_LEDS_CLASS=y
CONFIG_LEDS_TRIGGERS=y
CONFIG_LEDS_TRIGGER_TIMER=y
CONFIG_LEDS_TRIGGER_ONESHOT=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y

# ── NFC — RFID / contactless emulation + attacks ─────────────────
CONFIG_NFC=y
CONFIG_NFC_NCI=y
CONFIG_NFC_HCI=y
CONFIG_NFC_SHDLC=y
CONFIG_NFC_LLCP=y
CONFIG_NFC_NCI_UART=y
CONFIG_NFC_DIGITAL=y
CONFIG_NFC_ST_NCI=m
CONFIG_NFC_NXP_NCI=m
CONFIG_NFC_MRVL=m

# ── Hardware monitoring — power/thermal analysis ─────────────────
CONFIG_HWMON=y
CONFIG_THERMAL=y
CONFIG_THERMAL_HWMON=y
CONFIG_THERMAL_GOV_USER_SPACE=y

# ── Memory-mapped IO — direct hardware register access ────────────
CONFIG_STRICT_DEVMEM=n
CONFIG_IO_STRICT_DEVMEM=n
