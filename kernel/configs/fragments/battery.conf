# NH_KERNEL_FRAGMENT: battery v2.0
# Battery-optimized kernel config
# Apply on top of base.conf for battery variant

# Timer frequency (lower = less wakeups = better battery)
CONFIG_HZ_100=y
CONFIG_HZ=100
CONFIG_SCHED_HRTICK=n

# Preemption (voluntary yields better battery)
CONFIG_PREEMPT_NONE=y
CONFIG_PREEMPT_NONE_BUILD=y

# CPU idle
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_GOV_LADDER=y
CONFIG_CPU_IDLE_GOV_MENU=y
CONFIG_DT_IDLE_STATES=y
CONFIG_ARM64_CPUIDLE=y

# Power management
CONFIG_PM_WAKELOCKS_LIMIT=100
CONFIG_PM_ADVANCED_DEBUG=n
CONFIG_PM_TEST_SUSPEND=n
CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y

# CPU governors (powersave + schedutil only)
CONFIG_CPU_FREQ_GOV_PERFORMANCE=n
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=n

# Scheduler (energy-aware)
CONFIG_SCHED_TUNE=y
CONFIG_ENERGY_MODEL=y
CONFIG_ARM64_AMU_EXTN=y

# RCU (lazy for battery)
CONFIG_RCU_EXPERT=y
CONFIG_RCU_FAST_NO_HZ=y
CONFIG_RCU_NOCB_CPU=y
CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y
CONFIG_RCU_LAZY=y

# I/O (lower power)
CONFIG_IOSCHED_DEADLINE=y
CONFIG_DEFAULT_IOSCHED="deadline"

# Block layer power
CONFIG_BLK_WBT=y
CONFIG_BLK_WBT_MQ=y
CONFIG_BLK_CGROUP=y

# Dynamic tick
CONFIG_NO_HZ_FULL=n
CONFIG_NO_HZ_IDLE=y
CONFIG_NO_HZ=y
CONFIG_TICK_ONESHOT=y
CONFIG_HIGH_RES_TIMERS=y

# Compiler (size optimization for battery)
CONFIG_CC_OPTIMIZE_FOR_SIZE=y

# Network (disable unused features)
CONFIG_TCP_CONG_ADVANCED=n
CONFIG_TCP_CONG_CUBIC=y
CONFIG_DEFAULT_TCP_CONG="cubic"
CONFIG_DEFAULT_NET_SCH="fq_codel"
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_NET_SCH_FQ=n

# Disable debugging (reduces power consumption)
CONFIG_DEBUG_INFO=n
CONFIG_DEBUG_FS=n
CONFIG_DYNAMIC_DEBUG=n
CONFIG_MAGIC_SYSRQ=n
CONFIG_DEBUG_KERNEL=n
CONFIG_SCHED_STACK_END_CHECK=n
CONFIG_STACKPROTECTOR=n
CONFIG_STACKPROTECTOR_STRONG=n

# Suspend/resume optimization
CONFIG_SUSPEND=y
CONFIG_SUSPEND_SKIP_SYNC=y
CONFIG_PM_AUTOSLEEP=y
CONFIG_PM_WAKELOCKS=y
CONFIG_PM_WAKELOCKS_GC=y

# Disable audit (saves battery)
CONFIG_AUDIT=n
CONFIG_AUDITSYSCALL=n

# Disable tracing
CONFIG_FTRACE=n
CONFIG_FUNCTION_TRACER=n
CONFIG_STACK_TRACER=n
CONFIG_DYNAMIC_FTRACE=n
