# NH_KERNEL_FRAGMENT: containers v2.0
# Container and chroot support config
# Apply on top of base.conf for all variants

# Namespaces (every type for full container support)
CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y
CONFIG_USER_NS_UNPRIVILEGED=y

# Cgroups (v1 + v2)
CONFIG_CGROUPS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_HUGETLB=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_RDMA=y
CONFIG_CGROUP_BPF=y
CONFIG_CPUSETS=y
CONFIG_PROC_CHILDREN=y
CONFIG_CGROUP_WRITEBACK=y
CONFIG_MEMCG=y
CONFIG_MEMCG_KMEM=y
CONFIG_MEMCG_SWAP=y
CONFIG_BLK_CGROUP=y
CONFIG_BFQ_GROUP_IOSCHED=y

# Container runtimes
CONFIG_VETH=y
CONFIG_VXLAN=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_NET_VRF=y

# Overlay filesystem (critical for containers)
CONFIG_OVERLAY_FS=y
CONFIG_OVERLAY_FS_REDIRECT_DIR=y
CONFIG_OVERLAY_FS_REDIRECT_ALWAYS_FOLLOW=y
CONFIG_OVERLAY_FS_INDEX=y
CONFIG_OVERLAY_FS_XINO_AUTO=y
CONFIG_OVERLAY_FS_METACOPY=y

# Required syscalls for chroots
CONFIG_COMPAT=y
CONFIG_COMPAT_32BIT_TIME=y
CONFIG_SYSVIPC=y
CONFIG_POSIX_MQUEUE=y
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y

# Close_range syscall (OpenSSH 9.8+ requires it)
CONFIG_CLOSE_RANGE=y

# PG_owner_truncated sysctl
CONFIG_SYSCTL=y
CONFIG_SYSCTL_EXCEPTION_TRACE=y

# Pseudo-terminal
CONFIG_UNIX98_PTYS=y
CONFIG_PTY_WRITE_SPACE=y
CONFIG_LEGACY_PTYS=n

# Loop device (for mounting images)
CONFIG_BLK_DEV_LOOP=y
CONFIG_BLK_DEV_LOOP_MIN_COUNT=8

# Device mapper (for LXC snapshots)
CONFIG_BLK_DEV_DM=y
CONFIG_DM_SNAPSHOT=y
CONFIG_DM_MIRROR=y
CONFIG_DM_THIN_PROVISIONING=y
CONFIG_DM_CACHE=y
CONFIG_DM_CACHE_SMQ=y

# Binder for Android containers
CONFIG_ANDROID_BINDER_IPC=y
CONFIG_ANDROID_BINDERFS=y
CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"

# Seccomp (container security)
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

# BPF (container networking)
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_BPF_JIT_ALWAYS_ON=y
CONFIG_CGROUP_BPF=y
CONFIG_BPF_EVENTS=y
CONFIG_NET_CLS_BPF=y
CONFIG_NET_ACT_BPF=y
