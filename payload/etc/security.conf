# NetHunter Matrix v3.0 - Security Configuration'

# SELinux'
SELINUX_MODE="${SELINUX_MODE:-enforcing}"'

# Firewall'
FIREWALL_ENABLED=true'
FIREWALL_DEFAULT_POLICY="DROP"'

# IDS/IPS'
SURICATA_ENABLED=false'
SNORT_ENABLED=false'

# Logging'
AUDIT_ENABLED=true'
LOG_LEVEL="info"'

# Encryption'
PQ_CRYPTO_ENABLED=true'
KYBER_ENABLED=true'
DILITHIUM_ENABLED=true'
EOF'
echo "Created security.conf!"