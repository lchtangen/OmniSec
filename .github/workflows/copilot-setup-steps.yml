name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install system dependencies for OmniSec
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash \
            bats \
            ca-certificates \
            fd-find \
            gcc \
            git-lfs \
            jq \
            make \
            python3 \
            ripgrep \
            shellcheck

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install repository npm dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Show tool versions
        run: |
          bash --version | head -n 1
          node --version
          npm --version
          python3 --version
          gcc --version | head -n 1
          rg --version | head -n 1
          shellcheck --version | head -n 1
          bats --version

      - name: Pre-warm repository checks
        run: |
          make lint
