# GitHub Actions CI — OmniSec
# Runs 334 tests, zero failures tolerated

name: OmniSec CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # Daily at 4AM

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck python3
      - name: Shell syntax check
        run: |
          find . -name '*.sh' -exec shellcheck {} \;
          make lint-sh
      - name: C syntax check
        run: make lint-c
      - name: JSON validation
        run: make lint-json

  test:
    name: Test Suite (334 tests)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3 gcc
      - name: Run test suite
        run: |
          make stage
          make test
      - name: Verify 334+ tests pass
        run: |
          RESULT=$(make test 2>&1 | grep "results:" | grep -oE "[0-9]+ passed")
          if [ "$RESULT" -lt 334 ]; then
            echo "FAIL: Only $RESULT tests passed (need 334+)"
            exit 1
          fi
          echo "SUCCESS: $RESULT tests passed"

  build:
    name: Build All Artifacts
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build C tools
        run: make build-c
      - name: Stage payload
        run: make stage
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omnisec-payload
          path: payload/

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t omnisec:latest .
      - name: Test Docker image
        run: docker run --rm omnisec:latest nhctl help

  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [lint, test, build, docker]
    if: success()
    steps:
      - name: Notify
        run: echo "OmniSec CI passed — 334 tests, 0 failures"
