name: CI

on:
  push:
    branches: [main, master, nextgen]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      build_rootfs:
        description: 'Build chroot images'
        type: choice
        options: [none, arch, kali, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NH_VERSION: 2.0.0
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shell: [bash, dash, busybox]
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint
        run: |
          make lint
          shellcheck -s ${{ matrix.shell }} src/scripts/*.sh nhctl 2>/dev/null || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bash gcc make
      - name: Test
        run: make test

  build-c:
    name: Build C
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make build-c
          ls -la build/
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: c-binaries
          path: build/

  validate-module:
    name: Validate Magisk Module
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get install -y -qq zip gcc make unzip
      - name: Build module
        run: make build-module
      - name: Validate module ZIP
        run: |
          ZIP=$(ls deploy/magisk/dist/*.zip 2>/dev/null | head -1)
          [ -n "$ZIP" ] || { echo "No ZIP found"; exit 1; }
          echo "Module: $ZIP ($(du -h "$ZIP" | cut -f1))"
          unzip -l "$ZIP" | head -20
          unzip -l "$ZIP" | grep -q "module.prop" && echo "✓ module.prop" || { echo "✗ missing module.prop"; exit 1; }
          unzip -l "$ZIP" | grep -q "customize.sh" && echo "✓ customize.sh" || { echo "✗ missing customize.sh"; exit 1; }
      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: magisk-module
          path: deploy/magisk/dist/

  build-rootfs:
    name: Build Rootfs
    if: inputs.build_rootfs != 'none'
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        target: ${{ fromJSON(inputs.build_rootfs == 'both' && '["arch","kali"]' || format('["{0}"]', inputs.build_rootfs)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        run: |
          chmod +x src/scripts/build-chroot-image.sh
          src/scripts/build-chroot-image.sh --no-docker ${{ matrix.target }}
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-rootfs
          path: dist/

  publish-docker:
    name: Publish Docker Image
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}:${{ env.NH_VERSION }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-c, validate-module]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          make build
          make stage
          make dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            deploy/magisk/dist/*.zip
          generate_release_notes: true
          make_latest: true
