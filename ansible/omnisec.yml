---
# Ansible Playbook for OmniSec Deployment
# Usage: ansible-playbook -i inventory omnisec.yml

- name: Deploy OmniSec
  hosts: all
  become: yes
  vars:
    omnisec_version: "3.0"
    omnisec_repo: "https://github.com/lchtangen/OmniSec.git"
    install_dir: "/opt/omnisec"

  tasks:
    - name: Install dependencies (Ubuntu/Debian)
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - bash
        - git
        - make
        - gcc
        - python3
        - openssl
        - nmap
        - tcpdump
      when: ansible_os_family == "Debian"

    - name: Install dependencies (Arch)
      pacman:
        name: "{{ item }}"
        state: present
      loop:
        - bash
        - git
        - make
        - gcc
        - python3
        - openssl
        - nmap
      when: ansible_os_family == "Archlinux"

    - name: Clone OmniSec repository
      git:
        repo: "{{ omnisec_repo }}"
        dest: "{{ install_dir }}"
        version: "v{{ omnisec_version }}"

    - name: Stage build
      command: make stage
      args:
        chdir: "{{ install_dir }}"

    - name: Build C tools
      command: make build-c
      args:
        chdir: "{{ install_dir }}"

    - name: Run test suite
      command: make test
      args:
        chdir: "{{ install_dir }}"
      register: test_result
      failed_when: "'0 failed' not in test_result.stdout"

    - name: Install to system
      command: make install
      args:
        chdir: "{{ install_dir }}"
      when: ansible_os_family != "Android"

    - name: Verify installation
      command: nhctl help
      register: help_output
      changed_when: false

    - name: Display installation info
      debug:
        msg: "OmniSec v{{ omnisec_version }} deployed successfully!"

  handlers:
    - name: restart service
      systemd:
        name: omnisec
        state: restarted
