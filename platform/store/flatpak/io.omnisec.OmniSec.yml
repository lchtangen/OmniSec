id: io.omnisec.OmniSec
runtime: org.kde.Platform
runtime-version: "6.6"
sdk: org.kde.Sdk
command: omnisec
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --filesystem=home:rw
  - --filesystem=/media:ro
  - --filesystem=/mnt:ro
  - --env=PYTHONPATH=/app/lib/python3.11/site-packages
  - --talk-name=org.freedesktop.Flatpak
  - --system-talk-name=org.freedesktop.NetworkManager
  - --allow=multiarch

modules:
  - name: python3-psutil
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app psutil

  - name: python3-pycryptodome
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app pycryptodome

  - name: python3-requests
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app requests

  - name: python3-rich
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app rich

  - name: python3-matplotlib
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app matplotlib

  - name: python3-pillow
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app pillow

  - name: python3-qrcode
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app qrcode

  - name: python3-platformdirs
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app platformdirs

  - name: omnisec
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
    sources:
      - type: dir
        path: /app/build/omnisec
        dest: omnisec
